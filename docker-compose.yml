version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: localjobs_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: localjobs
      POSTGRES_PASSWORD: localjobs_secret_password
      POSTGRES_DB: localjobs_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./backend/app/repositories/postgres_schema.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U localjobs -d localjobs_db"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
