name: LocalJobs CI/CD Verification

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  test-and-verify:
    name: Automated Tests & Manual Verification Suite
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Initialize Database Workbook
        run: |
          python backend/app/repositories/init_db.py

      - name: Run Automated Pytest Suite (24/24 Tests)
        run: |
          python -m pytest backend/tests -v

      - name: Start Live Background Server for End-to-End Verification
        run: |
          python -m uvicorn backend.app.main:app --host 127.0.0.1 --port 8000 &
          sleep 4

      - name: Execute Manual Verification Journeys (16/16 Tests)
        run: |
          python run_manual_verification.py

      - name: Verify Health Endpoint
        run: |
          curl -f http://127.0.0.1:8000/health
          curl -f http://127.0.0.1:8000/ready
